[project]
name = "kaushalsetu"
version = "0.1.0"
description = "KaushalSetu — Agentic AI platform for skill-industry bridging in Indian districts"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # AI / Agents
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",

    # Embeddings
    "sentence-transformers>=3.0.0",

    # Schemas & Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # HTTP & Scraping
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "trafilatura>=1.8.0",
    "feedparser>=6.0.0",
    "pdfplumber>=0.11.0",
    "selenium>=4.20.0",
    "selenium-wire>=5.1.0",
    "webdriver-manager>=4.0.0",

    # News
    "gdeltdoc>=1.5.0",

    # NLP & Matching
    "rapidfuzz>=3.8.0",

    # Scheduling
    "apscheduler>=3.10.0",

    # Configuration
    "pyyaml>=6.0",

    # Observability
    "langfuse>=2.40.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml",
    "types-requests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["B008", "TC001", "TC002", "TC003", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that need a database",
    "eval: marks evaluation tests (run with 'make eval')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
